<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>현장조사 사진 지도 정리 도구</title>
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html { width: 100%; height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; overflow: hidden; background: #121212; color: #fff; }
    
    #app { display: flex; width: 100vw; height: 100vh; }
    
    /* 좌측 사이드바 패널 */
    #sidebar {
      width: 400px; min-width: 400px; height: 100%; background: #1e1e1e;
      border-right: 1px solid #333; display: flex; flex-direction: column; z-index: 1000;
      box-shadow: 2px 0 10px rgba(0,0,0,0.5);
    }
    
    .sidebar-header { padding: 16px; border-bottom: 1px solid #333; }
    .header-title { font-size: 1.2rem; font-weight: bold; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
    
    .toolbar-top { display: flex; gap: 8px; margin-bottom: 8px; }
    .toolbar-bottom { display: flex; gap: 8px; }
    
    .btn {
      flex: 1; padding: 8px; background: #2d2d2d; color: #e0e0e0;
      border: 1px solid #444; border-radius: 6px; font-size: 0.85rem; font-weight: 600;
      cursor: pointer; transition: 0.2s; text-align: center;
    }
    .btn:hover { background: #3d3d3d; color: #fff; }
    .btn-active { background: #d97706; color: #fff; border-color: #f59e0b; }
    .btn-active:hover { background: #b45309; }
    .btn-primary { background: #2563eb; border-color: #3b82f6; }
    .btn-primary:hover { background: #1d4ed8; }
    
    input[type="file"] { display: none; }

    /* 사진 목록 영역 */
    .list-header { padding: 12px 16px 4px; font-size: 0.85rem; color: #aaa; font-weight: bold; }
    #photo-list { flex: 1; overflow-y: auto; padding: 8px 16px 16px; display: flex; flex-direction: column; gap: 12px; }
    
    .photo-card {
      background: #252525; border: 1px solid #444; border-radius: 8px; padding: 12px;
      display: flex; flex-direction: column; gap: 8px; transition: border-color 0.2s; position: relative;
    }
    .photo-card.selected { border-color: #ef4444; box-shadow: 0 0 8px rgba(239, 68, 68, 0.4); }
    
    .status-tag {
      position: absolute; top: 12px; right: 12px; font-size: 10px; padding: 2px 6px;
      border-radius: 4px; font-weight: bold; background: #333; color: #fff;
    }
    .tag-gps { background: #166534; color: #4ade80; }
    .tag-modified { background: #854d0e; color: #facc15; }
    .tag-manual { background: #991b1b; color: #f87171; }
    .tag-none { background: #3f3f46; color: #a1a1aa; }

    .card-top { display: flex; gap: 12px; margin-top: 14px; }
    .card-thumb { position: relative; width: 70px; height: 70px; border-radius: 6px; overflow: hidden; flex-shrink: 0; cursor: pointer; }
    .card-thumb img { width: 100%; height: 100%; object-fit: cover; }
    .card-badge { position: absolute; top: 2px; left: 2px; background: #d97706; color: #fff; font-size: 10px; font-weight: bold; width: 16px; height: 16px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
    
    .card-info { flex: 1; font-size: 0.75rem; color: #aaa; display: flex; flex-direction: column; gap: 2px; line-height: 1.3; }
    .card-info strong { font-size: 0.85rem; color: #eee; word-break: break-all; margin-bottom: 2px; width: 90%; }
    
    .card-memo { width: 100%; background: #1a1a1a; border: 1px solid #333; color: #fff; padding: 6px 8px; border-radius: 4px; font-size: 0.8rem; outline: none; }
    .card-memo:focus { border-color: #555; }
    
    .card-actions { display: flex; justify-content: flex-end; gap: 6px; margin-top: 4px; }
    .card-actions button { background: transparent; border: none; color: #888; font-size: 0.75rem; cursor: pointer; padding: 4px 8px; border-radius: 4px; }
    .card-actions button:hover { background: #333; color: #fff; }
    .card-actions button.btn-delete:hover { background: rgba(239, 68, 68, 0.2); color: #ef4444; }

    /* 지도 영역 */
    #map-container { flex: 1; position: relative; }
    #map { width: 100%; height: 100%; background: #121212; }
    #map.pin-placement-mode { cursor: crosshair !important; }

    /* 방위표 */
    #north-arrow {
      position: absolute; top: 20px; right: 20px; z-index: 999;
      width: 50px; height: 50px; pointer-events: none;
      background: rgba(0,0,0,0.5); border-radius: 50%; padding: 5px;
    }
    #north-arrow svg { width: 100%; height: 100%; fill: #fff; }

    /* 일체형 커스텀 마커 & 부채꼴 CSS */
    .custom-marker { position: relative; width: 34px; height: 34px; }
    .marker-thumb {
      position: relative; z-index: 2; width: 34px; height: 34px; border-radius: 50%; 
      border: 2px solid #fff; box-shadow: 0 2px 6px rgba(0,0,0,0.5); object-fit: cover; background: #000; display: block;
    }
    .marker-badge {
      position: absolute; top: -6px; right: -6px; z-index: 3;
      background: #d97706; color: #fff; font-size: 10px; font-weight: bold; 
      width: 18px; height: 18px; border-radius: 50%; border: 1px solid #fff;
      display: flex; align-items: center; justify-content: center;
    }
    .marker-fan {
      position: absolute; top: -33px; left: -33px; width: 100px; height: 100px; 
      z-index: 1; pointer-events: none;
    }

    /* 팝업(위젯) 스타일 */
    .leaflet-popup-content-wrapper {
      background: rgba(24, 24, 27, 0.95) !important; color: #fff !important;
      border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 8px; width: 220px !important; padding: 0 !important;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5) !important;
    }
    .leaflet-popup-content { margin: 10px !important; width: 200px !important; }
    .leaflet-popup-tip { background: rgba(24, 24, 27, 0.95) !important; }
    .leaflet-popup-close-button { color: #fff !important; font-size: 18px !important; right: 8px !important; top: 8px !important; font-weight: bold; text-shadow: 0 0 2px #000; }
    .leaflet-popup-close-button:hover { color: #ef4444 !important; }
    
    .popup-img { width: 100%; height: 130px; object-fit: cover; border-radius: 4px; cursor: pointer; border: 1px solid #333; }
    .popup-info { font-size: 11px; margin-top: 8px; color: #d4d4d8; display: flex; flex-direction: column; gap: 3px; line-height: 1.3; }
    .popup-info strong { font-size: 12px; color: #fff; word-break: break-all; }
    
    .btn-address { background: #fee500; border: 1px solid #eab308; color: #374151; font-size: 11px; font-weight: bold; padding: 5px 8px; border-radius: 4px; cursor: pointer; transition: 0.2s; margin-top: 4px; text-align: center; width: 100%; }
    .btn-address:hover { background: #facc15; }
    .address-result { font-size: 11px; line-height: 1.4; padding: 4px; background: #27272a; border-radius: 4px; border: 1px solid #3f3f46; margin-top: 4px; }
    
    .popup-memo-display { background: #1a1a1a; padding: 6px; border-radius: 4px; margin-top: 6px; font-size: 11px; color: #fbbf24; word-break: break-all; border: 1px solid #333; }

    /* 드래그앤드롭 오버레이 */
    #drag-overlay {
      display: none; position: fixed; inset: 0; z-index: 99999;
      background: rgba(37, 99, 235, 0.2); backdrop-filter: blur(4px);
      border: 4px dashed #3b82f6; justify-content: center; align-items: center;
      font-size: 2rem; font-weight: bold; color: #fff; pointer-events: none;
    }
    body.dragover #drag-overlay { display: flex; }

    /* 라이트박스 및 로딩 */
    #lightbox { display: none; position: fixed; inset: 0; z-index: 9999; background: rgba(0, 0, 0, 0.9); justify-content: center; align-items: center; cursor: pointer; }
    #lightbox img { max-width: 90vw; max-height: 90vh; border-radius: 8px; box-shadow: 0 0 20px rgba(0,0,0,0.8); }
    #loading { display: none; position: fixed; inset: 0; z-index: 10000; background: rgba(0,0,0,0.7); color: #fff; font-size: 1.2rem; justify-content: center; align-items: center; }
  </style>
</head>
<body>

<div id="drag-overlay">📂 사진을 화면 전체 어디든 놓으세요</div>

<div id="app">
  <!-- 좌측 사이드바 -->
  <div id="sidebar">
    <div class="sidebar-header">
      <div class="header-title">
        <span>현장사진 지도</span>
        <span id="photo-count" style="font-size:0.9rem; color:#888;">사진 0 / 배치 0</span>
      </div>
      <div class="toolbar-top">
        <button class="btn" onclick="document.getElementById('file-input').click()">+ 사진 불러오기</button>
        <input type="file" id="file-input" multiple accept="image/*,.heic,.heif,.hif">
        <button class="btn btn-active" id="btn-toggle-fan">촬영방향 (토글)</button>
        <button class="btn" id="btn-fit-bounds">전체 보기</button>
      </div>
      <div class="toolbar-bottom">
        <button class="btn" id="btn-export-csv">CSV</button>
        <button class="btn" id="btn-export-geojson">GeoJSON</button>
        <button class="btn" id="btn-export-kmz">KMZ</button>
        <button class="btn btn-primary" id="btn-export-img">지도 캡처</button>
      </div>
    </div>
    <div class="list-header">배치된 사진 목록</div>
    <div id="photo-list"></div>
  </div>

  <!-- 우측 지도 영역 -->
  <div id="map-container">
    <div id="map"></div>
    <div id="north-arrow">
      <svg viewBox="0 0 100 100">
        <path d="M50 5 L70 95 L50 75 L30 95 Z" fill="#ef4444"/>
        <text x="50" y="85" font-size="20" font-weight="bold" fill="#fff" text-anchor="middle">N</text>
      </svg>
    </div>
  </div>
</div>

<div id="lightbox"><img id="lightbox-img" src="" alt="확대보기"></div>
<div id="loading">처리 중입니다... 잠시만 기다려주세요.</div>

<!-- 라이브러리 CDN -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/exifr@7.1.3/dist/full.umd.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.9.0/proj4.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/localforage/1.10.0/localforage.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<script>
  // 카카오 REST API 키 직접 입력 (서버 오류 완전 차단)
  const KAKAO_REST_API_KEY = "b5eff76d946e51e1214f081626b47d8b";

  // TM 좌표계 설정
  proj4.defs([
    ["EPSG:5185", "+proj=tmerc +lat_0=38 +lon_0=125 +k=1 +x_0=200000 +y_0=600000 +ellps=GRS80 +units=m +no_defs"],
    ["EPSG:5186", "+proj=tmerc +lat_0=38 +lon_0=127 +k=1 +x_0=200000 +y_0=600000 +ellps=GRS80 +units=m +no_defs"],
    ["EPSG:5187", "+proj=tmerc +lat_0=38 +lon_0=129 +k=1 +x_0=200000 +y_0=600000 +ellps=GRS80 +units=m +no_defs"],
    ["EPSG:5188", "+proj=tmerc +lat_0=38 +lon_0=131 +k=1 +x_0=200000 +y_0=600000 +ellps=GRS80 +units=m +no_defs"]
  ]);

  function getKoreanTM(lat, lng) {
    if (!lat || !lng) return { epsg: '', origin: '', x: '', y: '' };
    if (lng < 124 || lng > 132 || lat < 33 || lat > 39) return { epsg: '', origin: '', x: '', y: '' };
    let epsg = 'EPSG:5186', origin = '중부원점';
    if (lng < 126) { epsg = 'EPSG:5185'; origin = '서부원점'; }
    else if (lng >= 128 && lng < 130) { epsg = 'EPSG:5187'; origin = '동부원점'; }
    else if (lng >= 130) { epsg = 'EPSG:5188'; origin = '동해원점'; }
    const [x, y] = proj4("EPSG:4326", epsg, [lng, lat]);
    return { epsg, origin, x: x.toFixed(1), y: y.toFixed(1) };
  }

  // 지도 초기화
  const mapElem = document.getElementById('map');
  const map = L.map('map', { zoomControl: false, preferCanvas: true, closePopupOnClick: false }).setView([36.5, 127.5], 7);
  L.control.zoom({ position: 'bottomright' }).addTo(map);

  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
    maxZoom: 19, crossOrigin: true, attribution: 'Tiles &copy; Esri'
  }).addTo(map);

  let photos = [];
  let reassignPhotoId = null;
  let showFanSectors = true;

  localforage.config({ name: 'FieldPhotoDB', storeName: 'photos' });
  
  async function loadSavedData() {
    const saved = await localforage.getItem('photos_data');
    if (saved && Array.isArray(saved)) {
      photos = saved;
      photos.forEach(p => { p.marker = null; if (p.lat && p.lng) addMarkerToMap(p); });
      updateSidebarUI(); fitMapBounds();
    }
  }
  loadSavedData();

  async function saveToDB() {
    const dataToSave = photos.map(p => ({
      id: p.id, name: p.name, lat: p.lat, lng: p.lng, heading: p.heading,
      date: p.date, memo: p.memo, status: p.status,
      thumbUrl: p.thumbUrl, previewUrl: p.previewUrl
    }));
    await localforage.setItem('photos_data', dataToSave);
  }

  let dragCounter = 0;
  window.addEventListener('dragenter', (e) => { e.preventDefault(); dragCounter++; document.body.classList.add('dragover'); });
  window.addEventListener('dragleave', (e) => { e.preventDefault(); dragCounter--; if (dragCounter === 0) document.body.classList.remove('dragover'); });
  window.addEventListener('dragover', (e) => { e.preventDefault(); });
  window.addEventListener('drop', (e) => {
    e.preventDefault(); dragCounter = 0; document.body.classList.remove('dragover');
    if (e.dataTransfer.files.length > 0) processFiles(e.dataTransfer.files);
  });

  document.getElementById('file-input').addEventListener('change', (e) => {
    if (e.target.files.length > 0) processFiles(e.target.files);
    e.target.value = '';
  });

  async function processFiles(files) {
    document.getElementById('loading').style.display = 'flex';
    for (let file of Array.from(files)) {
      const ext = file.name.split('.').pop().toLowerCase();
      let blob = file;
      let conversionText = "";

      if (['heic', 'heif', 'hif'].includes(ext)) {
        try {
          if (!window.heic2any) await loadScript('https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js');
          const converted = await heic2any({ blob: file, toType: 'image/jpeg', quality: 0.8 });
          blob = Array.isArray(converted) ? converted[0] : converted;
          conversionText = "HEIC 변환됨";
        } catch(err) { console.warn(err); conversionText = "HEIC 변환 실패"; }
      }

      let exif = {};
      try { exif = await exifr.parse(file, { exif: true, gps: true }) || {}; } catch (e) { }

      const thumbUrl = await resizeImage(blob, 160);
      const previewUrl = await resizeImage(blob, 1280);
      const heading = exif.GPSImgDirection !== undefined ? exif.GPSImgDirection : (exif.GPSDestBearing !== undefined ? exif.GPSDestBearing : null);

      const photo = {
        id: Date.now() + Math.random(), name: file.name,
        lat: exif.latitude || null, lng: exif.longitude || null,
        heading: heading,
        date: exif.DateTimeOriginal ? new Date(exif.DateTimeOriginal).toLocaleString('ko-KR') : '',
        memo: conversionText, status: (exif.latitude && exif.longitude) ? 'GPS' : '미배치',
        thumbUrl, previewUrl, marker: null
      };

      photos.push(photo);
      if (photo.lat && photo.lng) addMarkerToMap(photo);
    }
    updateSidebarUI(); saveToDB();
    if(photos.filter(p=>p.lat).length > 0) fitMapBounds();
    document.getElementById('loading').style.display = 'none';
  }

  function createMarkerIcon(photo, idx) {
    let fanSvg = '';
    if (showFanSectors && photo.heading !== null && photo.heading !== undefined) {
      fanSvg = `
        <svg class="marker-fan" viewBox="0 0 100 100">
          <path d="M 50 50 L 26 8.43 A 48 48 0 0 1 74 8.43 Z" 
                fill="#fbbf24" fill-opacity="0.65" stroke="#f59e0b" stroke-width="1.5"
                transform="rotate(${photo.heading}, 50, 50)" />
        </svg>
      `;
    }
    return L.divIcon({
      className: 'custom-marker',
      html: `
        ${fanSvg}
        <img src="${photo.thumbUrl}" class="marker-thumb">
        <span class="marker-badge">${idx}</span>
      `,
      iconSize: [34, 34], iconAnchor: [17, 17], popupAnchor: [0, -17]
    });
  }

  // 카카오 주소 API 직접 호출 함수
  window.fetchAddress = async (btnElem, lat, lng) => {
    const parentContainer = btnElem.parentElement;
    btnElem.innerText = "⏳ 카카오 주소 검색 중...";
    
    try {
      const res = await fetch(`https://dapi.kakao.com/v2/local/geo/coord2address.json?x=${lng}&y=${lat}`, {
        method: 'GET',
        headers: { "Authorization": `KakaoAK ${KAKAO_REST_API_KEY}` }
      });
      const data = await res.json();
      
      if (data && data.documents && data.documents.length > 0) {
        const doc = data.documents[0];
        let addressHtml = "";
        
        if (doc.road_address && doc.road_address.address_name) {
          addressHtml += `<div style="color:#a7f3d0; margin-bottom: 4px;">🛣️ 도로명: ${doc.road_address.address_name}</div>`;
        }
        if (doc.address && doc.address.address_name) {
          addressHtml += `<div style="color:#fbbf24;">📍 지번: ${doc.address.address_name}</div>`;
        }
        
        if (addressHtml === "") {
          parentContainer.innerHTML = `<div class="address-result">해당 위치의 주소 데이터가 없습니다.</div>`;
        } else {
          parentContainer.innerHTML = `<div class="address-result">${addressHtml}</div>`;
        }
      } else {
        parentContainer.innerHTML = `<div class="address-result">주소를 찾을 수 없는 지역입니다.</div>`;
      }
    } catch(e) {
      console.error(e);
      parentContainer.innerHTML = `<div class="address-result" style="color:#f87171;">주소 변환 실패</div>`;
    }
  };

  function getPopupContent(photo) {
    const tm = getKoreanTM(photo.lat, photo.lng);
    const div = document.createElement('div');
    div.innerHTML = `
      <img src="${photo.previewUrl}" class="popup-img" onclick="openLightbox('${photo.previewUrl}')" title="클릭하여 확대">
      <div class="popup-info">
        <strong>${photo.name}</strong>
        <div>📅 ${photo.date || '날짜 정보 없음'}</div>
        <div>📍 ${tm.epsg ? `X ${tm.x} · Y ${tm.y}` : `${photo.lat.toFixed(5)}, ${photo.lng.toFixed(5)}`}</div>
        <div style="margin-top:2px;">
          <button class="btn-address" onclick="fetchAddress(this, ${photo.lat}, ${photo.lng})">카카오 주소 불러오기</button>
        </div>
      </div>
      ${photo.memo ? `<div class="popup-memo-display">${photo.memo}</div>` : ''}
    `;
    return div;
  }

  function addMarkerToMap(photo) {
    const idx = photos.findIndex(p => p.id === photo.id) + 1;
    
    if (photo.marker) { 
      photo.marker.setLatLng([photo.lat, photo.lng]);
      photo.marker.setIcon(createMarkerIcon(photo, idx));
      return; 
    }

    const marker = L.marker([photo.lat, photo.lng], { 
      icon: createMarkerIcon(photo, idx), 
      draggable: false
    }).addTo(map);
    photo.marker = marker;
    
    const popup = L.popup({ autoClose: false, closeOnClick: false }).setContent(getPopupContent(photo));
    marker.bindPopup(popup);
  }

  function updateSidebarUI() {
    const listElem = document.getElementById('photo-list');
    listElem.innerHTML = '';
    const mappedCount = photos.filter(p => p.lat).length;
    document.getElementById('photo-count').innerText = `사진 ${photos.length} / 배치 ${mappedCount}`;

    photos.forEach((p, index) => {
      const num = index + 1;
      
      if (p.marker) p.marker.setIcon(createMarkerIcon(p, num));

      const tm = getKoreanTM(p.lat, p.lng);
      const isReassigning = reassignPhotoId === p.id;
      
      let tagClass = 'tag-none';
      if (p.status === 'GPS') tagClass = 'tag-gps';
      else if (p.status === 'GPS·수정') tagClass = 'tag-modified';
      else if (p.status === '수동') tagClass = 'tag-manual';
      
      const card = document.createElement('div');
      card.className = `photo-card ${isReassigning ? 'selected' : ''}`;
      card.innerHTML = `
        <span class="status-tag ${tagClass}">${p.status}</span>
        <div class="card-top">
          <div class="card-thumb" onclick="openLightbox('${p.previewUrl}')">
            <span class="card-badge">${num}</span>
            <img src="${p.thumbUrl}">
          </div>
          <div class="card-info">
            <strong>${p.name}</strong>
            ${p.lat ? `
              <div>GPS : ${p.lat.toFixed(5)}, ${p.lng.toFixed(5)}</div>
              <div>${tm.epsg ? `TM : X ${tm.x} · Y ${tm.y}` : '국외 좌표'}</div>
              <div>촬영방향: ${p.heading !== null ? p.heading.toFixed(1) + '°' : '<span style="color:#f87171;">정보 없음</span>'}</div>
            ` : `<div style="color:#ef4444;">좌표 없음 (아래 '위치 지정' 클릭)</div>`}
          </div>
        </div>
        <input type="text" class="card-memo" placeholder="메모 입력..." value="${p.memo}">
        <div class="card-actions">
          <button onclick="startReassign(${p.id})">${isReassigning ? '취소' : '위치 다시 지정'}</button>
          <button onclick="openLightbox('${p.previewUrl}')">크게 보기</button>
          <button class="btn-delete" onclick="deletePhoto(${p.id})">삭제</button>
        </div>
      `;

      card.querySelector('.card-memo').addEventListener('change', (e) => {
        p.memo = e.target.value; 
        saveToDB();
        if (p.marker && p.marker.getPopup()) p.marker.getPopup().setContent(getPopupContent(p));
      });

      listElem.appendChild(card);
    });
  }

  window.deletePhoto = (id) => {
    if(!confirm("이 사진을 삭제하시겠습니까?")) return;
    const idx = photos.findIndex(p => p.id === id);
    if(idx > -1) {
      if(photos[idx].marker) map.removeLayer(photos[idx].marker);
      photos.splice(idx, 1);
      updateSidebarUI(); saveToDB();
    }
  };

  window.startReassign = (id) => {
    if (reassignPhotoId === id) {
      reassignPhotoId = null; mapElem.classList.remove('pin-placement-mode');
    } else {
      reassignPhotoId = id; mapElem.classList.add('pin-placement-mode');
    }
    updateSidebarUI();
  };

  map.on('click', (e) => {
    if (reassignPhotoId) {
      const p = photos.find(x => x.id === reassignPhotoId);
      if(p) {
        p.lat = e.latlng.lat; p.lng = e.latlng.lng; p.status = '수동'; 
        addMarkerToMap(p);
        reassignPhotoId = null; mapElem.classList.remove('pin-placement-mode');
        updateSidebarUI(); saveToDB();
      }
    }
  });

  document.getElementById('btn-toggle-fan').onclick = (e) => {
    showFanSectors = !showFanSectors;
    e.target.classList.toggle('btn-active', showFanSectors);
    photos.forEach((p, i) => { if (p.marker) p.marker.setIcon(createMarkerIcon(p, i + 1)); });
  };
  
  function fitMapBounds() {
    const mapped = photos.filter(p => p.lat && p.lng);
    if (mapped.length > 0) map.fitBounds(L.latLngBounds(mapped.map(p => [p.lat, p.lng])), { padding: [50, 50] });
  }
  document.getElementById('btn-fit-bounds').onclick = fitMapBounds;

  document.getElementById('btn-export-img').onclick = async () => {
    document.getElementById('loading').innerText = "지도 이미지를 생성 중입니다...";
    document.getElementById('loading').style.display = 'flex';
    try {
      const canvas = await html2canvas(document.getElementById('map-container'), { useCORS: true, allowTaint: false, backgroundColor: '#121212' });
      const link = document.createElement('a'); link.download = 'Map_Export_' + new Date().getTime() + '.png'; link.href = canvas.toDataURL('image/png'); link.click();
    } catch (e) { alert("지도 이미지 생성에 실패했습니다."); console.error(e); }
    document.getElementById('loading').style.display = 'none';
  };

  document.getElementById('btn-export-csv').onclick = () => {
    let csv = "\uFEFF번호,파일명,위도,경도,X(동향),Y(북향),원점,EPSG,촬영일시,방향,상태,메모\n";
    photos.forEach((p, i) => {
      const tm = getKoreanTM(p.lat, p.lng) || { x:'', y:'', origin:'', epsg:'' };
      csv += `${i+1},"${p.name}",${p.lat||''},${p.lng||''},${tm.x},${tm.y},"${tm.origin}","${tm.epsg}","${p.date}",${p.heading||''},"${p.status}","${p.memo}"\n`;
    });
    downloadFile(csv, '현장조사_목록.csv', 'text/csv;charset=utf-8;');
  };

  document.getElementById('btn-export-geojson').onclick = () => {
    const features = photos.filter(p => p.lat && p.lng).map((p, i) => {
      const tm = getKoreanTM(p.lat, p.lng);
      return { type: "Feature", geometry: { type: "Point", coordinates: [p.lng, p.lat] }, properties: { no: i+1, name: p.name, x: tm.x, y: tm.y, origin: tm.origin, epsg: tm.epsg, date: p.date, heading: p.heading, status: p.status, memo: p.memo } };
    });
    downloadFile(JSON.stringify({ type: "FeatureCollection", features }, null, 2), '현장조사.geojson', 'application/json');
  };

  document.getElementById('btn-export-kmz').onclick = async () => {
    document.getElementById('loading').innerText = "KMZ 생성 중..."; document.getElementById('loading').style.display = 'flex';
    const zip = new JSZip(); let kml = `<?xml version="1.0" encoding="UTF-8"?><kml xmlns="http://www.opengis.net/kml/2.2"><Document>`;
    for (let i = 0; i < photos.length; i++) {
      const p = photos[i]; if (!p.lat || !p.lng) continue;
      const imgName = `img_${i+1}.jpg`; const base64Data = p.previewUrl.split(',')[1];
      zip.file(`images/${imgName}`, base64Data, { base64: true });
      kml += `<Placemark><name>${i+1}. ${p.name}</name><description><![CDATA[<img src="images/${imgName}" width="400" /><br/><p><strong>상태:</strong> ${p.status}</p><p><strong>촬영일:</strong> ${p.date}</p><p><strong>방향:</strong> ${p.heading ? p.heading + '°' : '없음'}</p><p><strong>메모:</strong> ${p.memo}</p>]]></description><Point><coordinates>${p.lng},${p.lat},0</coordinates></Point></Placemark>`;
    }
    kml += `</Document></kml>`; zip.file("doc.kml", kml);
    const blob = await zip.generateAsync({ type: "blob" });
    downloadFile(blob, '현장조사.kmz', 'application/vnd.google-earth.kmz');
    document.getElementById('loading').style.display = 'none';
  };

  function resizeImage(file, max) {
    return new Promise((resolve) => {
      const img = new Image();
      img.onload = () => {
        let w = img.width, h = img.height;
        if (w > h) { if (w > max) { h *= max / w; w = max; } } else { if (h > max) { w *= max / h; h = max; } }
        const cvs = document.createElement('canvas'); cvs.width = w; cvs.height = h;
        cvs.getContext('2d').drawImage(img, 0, 0, w, h); resolve(cvs.toDataURL('image/jpeg', 0.85));
      }; img.src = URL.createObjectURL(file);
    });
  }

  function downloadFile(content, fileName, mimeType) {
    const a = document.createElement('a'); const blob = content instanceof Blob ? content : new Blob([content], { type: mimeType });
    a.href = URL.createObjectURL(blob); a.download = fileName; a.click();
  }
  
  function loadScript(src) { return new Promise((resolve, reject) => { const s = document.createElement('script'); s.src = src; s.onload = resolve; s.onerror = reject; document.head.appendChild(s); }); }

  window.openLightbox = (src) => { document.getElementById('lightbox-img').src = src; document.getElementById('lightbox').style.display = 'flex'; };
  document.getElementById('lightbox').onclick = () => { document.getElementById('lightbox').style.display = 'none'; };
</script>
</body>
</html>
